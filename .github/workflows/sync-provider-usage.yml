name: Sync Provider Usage
# Hits POST /api/jobs/sync-provider-usage to poll each configured provider
# admin key (OpenAI/Anthropic etc.) and ingest recent usage buckets.
#
# Triggers:
#   - Every 5 minutes via cron (GitHub fires ~every 60-90 min in practice).
#   - After every successful "Deploy to Vercel" run, so a fresh deploy always
#     gets an immediate sync rather than waiting for the next cron window.
#   - Manual dispatch.
#
# Required GitHub repo secrets:
#   SYNTHFORCE_API_URL   – e.g. https://synthforceai.com (no trailing slash)
#   SYNC_JOB_SECRET      – must match SYNC_JOB_SECRET in the Vercel env
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ["Deploy to Vercel"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  sync:
    # For workflow_run events: only proceed if the deploy succeeded.
    # For schedule/workflow_dispatch: github.event_name != 'workflow_run' is
    # true so the condition passes unconditionally.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Debug secrets
        run: |
          echo "URL: ${{ secrets.SYNTHFORCE_API_URL }}"
          echo "Secret length: ${#SYNC_JOB_SECRET}"
          echo "Secret first 10 chars: ${SYNC_JOB_SECRET:0:10}"
        env:
          SYNC_JOB_SECRET: ${{ secrets.SYNC_JOB_SECRET }}

      - name: Trigger sync endpoint
        run: |
          curl --fail --silent --show-error\
            -X POST "${{ secrets.SYNTHFORCE_API_URL }}/api/jobs/sync-provider-usage" \
            -H "Authorization: Bearer ${{ secrets.SYNC_JOB_SECRET }}" \
            -H "Content-Type: application/json"
