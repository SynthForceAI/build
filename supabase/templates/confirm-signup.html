<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your SynthForce email</title>
</head>
<body style="margin: 0; padding: 0;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="background-color: white; border-radius: 8px; overflow: hidden; max-width: 600px; width: 100%;">
          <tr style="background-color: #0099ff;">
            <td style="padding: 0; text-align: center; vertical-align: middle; height: 150px;">
              <img src="https://www.synthforceai.com/assets/7.png" alt="SynthForce" width="auto" height="150" style="height: 150px; width: auto; display: block; margin: 0 auto; border: 0;">
            </td>
          </tr>
          <tr>
            <td style="padding: 40px; text-align: center;">
              <h2 style="margin: 0 0 16px; color: #1a1a1a; font-size: 20px; font-weight: 600;">Verify your email</h2>
              <p style="margin: 0 0 32px; color: #666666; font-size: 15px; line-height: 1.6;">Click the button below to confirm your email and start managing your synthetic workforce.</p>
              <a href="{{ .ConfirmationURL }}" style="display: inline-block; background-color: #0099ff; color: #ffffff; padding: 14px 40px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 15px;">Verify Email</a>
            </td>
          </tr>
          <tr>
            <td style="padding: 24px 40px; border-top: 1px solid #eeeeee; color: #999999; font-size: 13px; text-align: center;">
              <p style="margin: 0;">This link expires in 24 hours. If you didn&apos;t create an account, you can safely ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
